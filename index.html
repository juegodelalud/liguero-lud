<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera Universitaria — LUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Paleta inspirada en la identidad real de la Liga Universitaria de Deportes (LUD):
     fondo claro, header azul marino con linea dorada, acentos celestes tipo "Otros Deportes". */
  :root{
    --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3F6FB; --border:#D7E0EE;
    --text:#152449; --muted:#5E6E8C;
    --navy:#0F2050; --navy2:#14306E; --skyblue:#2E8FE0; --skyblue-soft:#E6F1FC;
    --gold:#F2B632; --gold-soft:#FBEBC7;
    --silver:#7C8798; --silver-soft:#E7E9EE;
    --bronze:#B9683A; --bronze-soft:#F5E2D3;
    --honor:#7B4FC9; --honor-soft:#EDE3FA;
    --confrat:#2E8FE0; --confrat-soft:#E6F1FC;
    --green:#1E9E63; --green-soft:#E3F6EC;
    --red:#D23B2B; --red-soft:#FBE6E3;
    --gold-text:#8A5D06; --silver-text:#4B5563; --bronze-text:#7A3F1D; --honor-text:#5B3499; --confrat-text:#155FA0; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  #topbar{background:var(--navy);border-bottom:4px solid var(--gold);}
  #topbar-inner{max-width:960px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;}
  .lud-logo{font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.02em;color:#fff;display:flex;gap:8px;align-items:center;}
  .lud-logo b{color:var(--gold);}
  .lud-tag{font-family:'Space Grotesk';font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#BFD3F5;}
  #subnav{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.1);}
  #subnav-inner{max-width:960px;margin:0 auto;padding:8px 18px;display:flex;gap:16px;flex-wrap:wrap;}
  #subnav-inner span{font-family:'Space Grotesk';font-size:11px;color:#BFD3F5;letter-spacing:.04em;display:inline-flex;align-items:center;gap:5px;opacity:.9;}
  #subnav-inner span.hl{background:var(--skyblue);color:#fff;padding:3px 10px;border-radius:999px;opacity:1;}
  #app{max-width:960px;margin:0 auto;padding:26px 18px 40px;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .eyebrow{font-family:'Space Grotesk',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold-text);margin-bottom:8px;font-weight:600;}
  .muted{color:var(--muted);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,32,80,.06);}
  .btn{font-family:'Space Grotesk',monospace;font-weight:500;font-size:14px;background:var(--navy);color:#fff;border:none;border-radius:999px;padding:12px 22px;cursor:pointer;transition:transform .12s ease, opacity .12s ease;}
  .btn:hover{transform:translateY(-1px);opacity:.92;}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.gold{background:var(--gold);color:#241B04;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:8px 14px;font-size:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-family:'Inter';font-size:14px;outline:none;}
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  label.field-label{font-family:'Space Grotesk',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:6px;}
  .pill-choice{display:flex;gap:8px;}
  .pill-choice button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Inter';font-size:14px;}
  .pill-choice button.active{background:var(--gold);border-color:var(--gold);color:#241B04;font-weight:600;}
  .pitch{background:linear-gradient(180deg,#0f2b1e,#0a1c14);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .pitch-line{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap;}
  .pos-btn{min-width:52px;padding:8px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#F2F5FA;font-family:'Space Grotesk';font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
  .pos-btn.active{background:var(--gold);border-color:var(--gold);color:#241B04;font-weight:700;}
  .shirt-card{background:radial-gradient(circle at 30% 20%, #1c3566, #0a1730);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center;}
  .shirt-num{font-family:'Barlow Condensed';font-size:56px;font-weight:800;color:var(--gold);line-height:1;}
  .shirt-name{font-family:'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;font-size:15px;margin-top:4px;}
  .club-offer{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .12s ease, transform .12s ease;}
  .club-offer:hover{border-color:var(--gold);transform:translateY(-1px);}
  .club-offer .family-tag{display:inline-block;font-family:'Space Grotesk';font-size:10px;color:var(--skyblue);background:var(--skyblue-soft);padding:2px 7px;border-radius:999px;margin-top:5px;}
  .div-tag{display:inline-block;font-family:'Space Grotesk';font-size:11px;color:var(--gold-text);border:1px solid var(--gold-soft);background:var(--gold-soft);padding:2px 8px;border-radius:999px;margin-top:6px;font-weight:600;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:14px 0;}
  .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;}
  .stat-box .v{font-family:'Barlow Condensed';font-size:23px;font-weight:700;}
  .stat-box .l{font-family:'Space Grotesk';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;}
  .attr-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
  .attr-row .bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;margin:0 8px;overflow:hidden;}
  .attr-row .bar span{display:block;height:100%;background:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'Space Grotesk';font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:7px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;font-family:'Space Grotesk';font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);margin:1px 2px 1px 0;}
  .tag.up{color:var(--green);border-color:var(--green-soft);background:var(--green-soft);}
  .tag.down{color:var(--red);border-color:var(--red-soft);background:var(--red-soft);}
  .tag.oro{color:var(--gold-text);border-color:var(--gold-soft);background:var(--gold-soft);font-weight:600;}
  .tag.plata{color:var(--silver-text);border-color:var(--silver-soft);background:var(--silver-soft);font-weight:600;}
  .tag.bronce{color:var(--bronze-text);border-color:var(--bronze-soft);background:var(--bronze-soft);font-weight:600;}
  .tag.honor{color:var(--honor-text);border-color:var(--honor-soft);background:var(--honor-soft);font-weight:600;}
  .tag.confrat{color:var(--confrat-text);border-color:var(--confrat-soft);background:var(--confrat-soft);font-weight:600;}
  .badge-ovr{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--gold);color:#241B04;border-radius:10px;font-family:'Barlow Condensed';font-weight:800;font-size:18px;}
  .event-box{border:1px dashed var(--gold-soft);background:var(--gold-soft);border-radius:12px;padding:16px;margin-bottom:16px;}
  .trophy-list{display:flex;flex-direction:column;gap:6px;}
  .trophy-item{display:flex;gap:10px;align-items:center;font-size:14px;}
  .disclaimer{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:18px;}
  a{color:var(--gold-text);}

  .details-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;}
  .details-row{font-size:13px;padding:5px 0;color:var(--text);}
  .details-row:before{content:'◆ ';color:var(--gold-text);}

  @keyframes trophyPop{0%{transform:scale(0) rotate(-15deg);opacity:0;}60%{transform:scale(1.2) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  .trophy-anim{text-align:center;margin:10px 0 18px;}
  .trophy-anim .icon{display:inline-block;animation:trophyPop .7s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 16px var(--gold));}
  .trophy-anim .icon svg{display:block;margin:0 auto;width:72px;height:auto;}
  .trophy-anim.small .icon{filter:drop-shadow(0 0 10px var(--gold));}
  .trophy-anim.small .icon svg{width:42px;}
  .trophy-anim .label{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-text);margin-top:4px;font-size:15px;}
  .trophy-anim.small .label{font-size:12px;}
  .trophy-anim.honor .icon{filter:drop-shadow(0 0 16px var(--honor));}
  .trophy-anim.honor .label{color:var(--honor);}

  #footerbar{max-width:960px;margin:0 auto;padding:6px 18px 30px;text-align:center;}
  .credit{font-size:10px;color:var(--muted);opacity:.55;margin-top:4px;}
  .counter{font-size:11px;color:var(--muted);opacity:.7;margin-top:2px;}

  #feedbackBtn{position:fixed;bottom:18px;right:18px;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#241B04;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:50;}
  .modal-overlay{position:fixed;inset:0;background:rgba(5,10,25,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:380px;width:100%;}
  .rate-row{display:flex;gap:10px;margin:10px 0;}
  .rate-btn{flex:1;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:22px;cursor:pointer;text-align:center;}
  .rate-btn.active{border-color:var(--gold);background:var(--gold-soft);}
</style>
</head>
<body>
<div id="topbar">
  <div id="topbar-inner">
    <div class="lud-logo"><svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <path d="M50 6 L90 20 V50 C90 74 72 90 50 96 C28 90 10 74 10 50 V20 Z" fill="#ffffff" opacity=".14"/>
      <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
        <line x1="50" y1="86" x2="20" y2="24"/>
        <line x1="50" y1="86" x2="32" y2="18"/>
        <line x1="50" y1="86" x2="44" y2="14"/>
        <line x1="50" y1="86" x2="56" y2="14"/>
        <line x1="50" y1="86" x2="68" y2="18"/>

    </svg> LIGA <b>UNIVERSITARIA</b></div>
    <div class="lud-tag">Modo Carrera</div>
  </div>
</div>
<div id="subnav">
  <div id="subnav-inner">
    <span class="hl">⚽ Fútbol</span>
    <span>📊 Estadísticas</span>
    <span>🏆 Divisionales</span>
    <span>🎓 Formativas</span>
    <span onclick="openRules()" style="cursor:pointer;text-decoration:underline;">📋 Detalles de la Liga</span>
  </div>
</div>
<div id="app"></div>
<div id="footerbar">
  <div class="counter">🏆 <span id="careerCount">—</span> carreras iniciadas en total</div>
  <div class="counter">⚽ <span id="seasonsCount">—</span> partidas jugadas por todos</div>
  <div class="credit">SG</div>
</div>

<button id="feedbackBtn" title="Dejar comentario">💬</button>
<div class="modal-overlay" id="feedbackModal">
  <div class="modal-box">
    <div id="feedbackForm">
      <h3 style="font-size:18px;">¿Qué te pareció?</h3>
      <div class="rate-row">
        <button class="rate-btn" id="rateUp">👍</button>
        <button class="rate-btn" id="rateDown">👎</button>
      </div>
      <label class="field-label">Comentario / sugerencia (opcional)</label>
      <textarea id="feedbackComment" placeholder="Qué mejorarías..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn gold" id="sendFeedback">Enviar</button>
        <button class="btn secondary" id="closeFeedback">Cerrar</button>
      </div>
    </div>
    <div id="feedbackThanks" style="display:none;text-align:center;">
      <h3>¡Gracias!</h3>
      <p class="muted">Tu comentario ya quedó guardado.</p>
      <button class="btn gold" id="closeFeedback2">Cerrar</button>
    </div>
  </div>
</div>

const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.round(rand(a,b));
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- Identidad histórica de los clubes ---------- */
// Hash determinístico: mismo nombre -> mismo número siempre (no cambia entre partidas ni recargas).
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; } return h; }

// Antes existían variantes de color (equipos filiales) para algunas instituciones, pero se
// sacaron de la nómina: ahora cada institución tiene un único club oficial (ej. "Old Christians
// Club" a secas, sin "Azul"/"Verde"/"Blanco"). Esta lógica de familias queda por compatibilidad,
// pero ya no hay ningún caso real de variantes en CLUB_NAMES.
const VARIANT_TOKENS = new Set(['Club','Azul','Verde','Blanco','Blanca','Naranja','Rojo','Roja','Rosado','Celeste','Amarillo','Amarilla']);
function clubCore(name){
  const words = name.split(' ');
  while(words.length>1 && VARIANT_TOKENS.has(words[words.length-1])) words.pop();
  return words.join(' ');
}

// Fuerza histórica en pirámide: pocos clubes "grandes" (tier 0, cerca de la A) y muchos más humildes
// (tiers altos, cerca de la G). Así se respeta que un club chico no aparezca de golpe arriba de todo.
const TIER_WEIGHTS = [3,6,10,16,22,24,19]; // tier 0..6
const TIER_CUM = (()=>{ let acc=0; return TIER_WEIGHTS.map(w=>(acc+=w)); })();
const TIER_TOTAL = TIER_CUM[TIER_CUM.length-1];
function tierFromHash(h){
  const x = h % TIER_TOTAL;
  for(let i=0;i<TIER_CUM.length;i++){ if(x<TIER_CUM[i]) return i; }
  return TIER_CUM.length-1;
}

const CLUB_POOL = CLUB_NAMES.map(name=>{
  const core = clubCore(name);
  const siblings = _familyMembers[core];
  const isParent = siblings[0]===name; // el listado primero de la familia es el equipo principal
  const baseTier = _familyHomeTier[core];
  // Los equipos filiales suelen jugar igual o un poco más flojo que el plantel principal.

  const tier = REAL_TIER_OVERRIDE[name]!==undefined ? REAL_TIER_OVERRIDE[name] : estimatedTier;
  return {name, family:core, isParent, tier, siblingCount:siblings.length};

  return (g!==undefined) ? DIV_LETTERS[g] : null;
}
const CLUB_BY_NAME = {}; CLUB_POOL.forEach(c=> CLUB_BY_NAME[c.name]=c);
function clubOf(name){ return CLUB_BY_NAME[name] || {name, family:name, isParent:true, tier:3, siblingCount:1}; }
function familyParentOf(name){
  const c = clubOf(name);
  return CLUB_POOL.find(x=>x.family===c.family && x.isParent) || c;

// Convierte la fuerza histórica (escala 0..6, "A..G") a la cantidad real de divisiones de la categoría.
function tierInCategory(tier, divisions){ return clamp(Math.round(tier*(divisions-1)/6), 0, divisions-1); }
function baseStrengthAdult(tier){ return 78 - tier*7; }

/* ---------- Atributos ---------- */
function initAttrs(pos){
  const attrs = {};
  ATTR_KEYS.forEach(k=> attrs[k] = clamp(42 + randi(-5,5), 25, 60));
  const w = POSITION_WEIGHTS[pos];
  const top2 = Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  top2.forEach(k=> attrs[k]=clamp(attrs[k]+10,25,70));
  return attrs;
}
function computeOVR(attrs,pos){
  const w = POSITION_WEIGHTS[pos];
  let sum=0, wsum=0;
  Object.keys(w).forEach(k=>{ sum+=attrs[k]*w[k]; wsum+=w[k]; });
  return Math.round(sum/wsum);
}
function growAttributes(p, extra){
  extra = extra || {};
  const age = p.edad;
  const physKeys=['velocidad','fisico','resistencia','cabezazo'];
  const techKeys=['definicion','pase'];
  const mentKeys=['vision','liderazgo'];
  let physDelta, techDelta, mentDelta;
  if(age<=19){ physDelta=rand(2,5); techDelta=rand(2,5); mentDelta=rand(0,2); }
  else if(age<=25){ physDelta=rand(1,4); techDelta=rand(1,3); mentDelta=rand(0,2); }
  else if(age<=29){ physDelta=rand(-1,2); techDelta=rand(0,2); mentDelta=rand(1,3); }
  else if(age<=34){ physDelta=rand(-3,0); techDelta=rand(-1,1); mentDelta=rand(1,3); }
  else if(age<=44){ physDelta=rand(-4,-1); techDelta=rand(-2,0); mentDelta=rand(0,2); }
  else { physDelta=rand(-5,-2); techDelta=rand(-3,-1); mentDelta=rand(-1,1); }
  physKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+physDelta+rand(-1,1)+(extra[k]||0),20,99));
  techKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+techDelta+rand(-1,1)+(extra[k]||0),20,99));
  mentKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+mentDelta+rand(-1,1)+(extra[k]||0),20,99));
  p.ovr = computeOVR(p.attrs, p.posicion);
  p.peakOvr = Math.max(p.peakOvr, p.ovr);
}

/* ================= SIMULACIÓN ================= */
// Pequeño empujón de "protagonista": sube apenas la probabilidad de salir campeón (liga, copas
// y honor). Es un ajuste chico a propósito: no debe hacer que siempre ganes, solo mejorar un poco
// tus chances frente a un rival de nivel parejo. Para hacerlo más notorio, subir estos números;
// para volver a como estaba antes, ponerlos en 0.
const CHAMPION_LUCK_RATING = 0.5;   // puntos extra de rating en las tablas de posiciones
const CHAMPION_LUCK_CHANCE = 0.015; // extra de probabilidad (0 a 1) en llaves de Copa/Honor
function simulateStandingsJuvenil(ovr, n){
  const arr=[];
  for(let i=0;i<n-1;i++) arr.push({p:false, r: BASE_STRENGTH_JUVENIL + rand(-16,16)});
  arr.push({p:true, r: ovr + CHAMPION_LUCK_RATING + rand(-8,8)});
  arr.sort((a,b)=>b.r-a.r);
  return arr.findIndex(t=>t.p)+1;
}
function simulateStandingsAdulta(tier, ovr){
  const n=16;
  const base = baseStrengthAdult(tier);
  const arr=[];
  for(let i=0;i<n-1;i++) arr.push({p:false, r: base + rand(-14,14)});
  arr.push({p:true, r: ovr*0.9 + CHAMPION_LUCK_RATING + rand(-8,8)});
  arr.sort((a,b)=>b.r-a.r);
  return arr.findIndex(t=>t.p)+1;
}
function simulateBracket(rounds, winChance){
  let advanced=0;
  for(let r=0;r<rounds;r++){ if(Math.random()<winChance) advanced++; else break; }
  return {advanced, rounds, champ: advanced===rounds};
}
function simulateHonor(ovr, refStrength){
  const chance = clamp(0.42 + (ovr-refStrength)/120 + CHAMPION_LUCK_CHANCE, .1, .7);
  return simulateBracket(4, chance);
}
// Ascenso/descenso: siempre un solo escalón por temporada (nunca de la G a la A de una).
// Ascenso/descenso siempre de un solo escalón por temporada (nunca de la G a la A de una).
// En Divisionales de 16 equipos: suben los primeros 4, bajan los últimos 4.
function updateTierAdulta(cat, tier, posFinal){
  let newTier=tier, note=null, dir=null;
  if(posFinal<=4 && tier>0){ newTier=tier-1; note='Ascenso a Divisional '+DIV_LETTERS[newTier]; dir='up'; }
  else if(posFinal>=cat.teams-3 && tier<cat.divisions-1){ newTier=tier+1; note='Descenso a Divisional '+DIV_LETTERS[newTier]; dir='down'; }
  return {newTier, note, dir};
}
// La divisional inicial se ancla en la fuerza histórica del club (no solo en el nivel del jugador),
// con un ajuste de a lo sumo un escalón si el rendimiento es muy superior o muy inferior al del club.
function assignInitialAdultTier(cat, ovr, clubName){
  const home = tierInCategory(clubOf(clubName).tier, cat.divisions);
  const ref = baseStrengthAdult(home);
  let adj = 0;
  if(ovr >= ref+14) adj = -1;
  else if(ovr <= ref-14) adj = 1;
  return clamp(home+adj, 0, cat.divisions-1);
}

function getEventPool(p){
  const pool = [EVENT_INJURY, EVENT_CAPTAIN, EVENT_LOCKERROOM, EVENT_COACH_FIGHT];
  if(p.edad<24) pool.push(EVENT_EXAMS);
  if(p.edad>=23 && !p.milestones.graduated) pool.push(EVENT_GRADUATION);
  if(p.edad>=24 && !p.milestones.employed) pool.push(EVENT_JOB);

  if(p.edad>=28 && p.milestones.married && !p.milestones.child) pool.push(EVENT_CHILD);
  return pool;
}

  p.club = name; p.clubsPlayed.push(name);
  p.lastCategoryId='sub14'; p.serieLetter = realSerieLetter('sub14', p.club) || DIV_LETTERS[randi(0,3)];
  state.screen='season'; render();
}

function currentCategory(){ return categoryForAge(state.player.edad); }

function playSeason(){
  // Cada click real en "Jugar temporada" suma 1 al contador global de partidas jugadas.
  incrementSeasonsCounter();
  const p = state.player;
  const cat = currentCategory();
  let posFinal, tierLabel, cupResult=null, honorResult=null, tierUpdate={note:null,dir:null,newTier:p.clubDivisionTier};

  if(cat.type==='juvenil'){
    // Sub 14, Sub 16 y Sub 18 no tienen Campeonato de Honor (eso arranca recién en Sub 20).
    // Sus únicos torneos son estas cuatro copas, según la posición final en la serie.
    const serieN = serieTeamsFor(cat.id);
    posFinal = simulateStandingsJuvenil(p.ovr, serieN);
    tierLabel = 'Serie '+p.serieLetter;
    const quarter = Math.ceil(serieN/4);
    let label, diffAdj;
    if(posFinal<=quarter){label='Copa de Oro'; diffAdj=0;}
    else if(posFinal<=quarter*2){label='Copa de Plata'; diffAdj=-6;}
    else if(posFinal<=quarter*3){label='Copa de Bronce'; diffAdj=-12;}
    else {label='Copa de Confraternidad'; diffAdj=-18;}
    const chance = clamp(0.5 + (p.ovr-(BASE_STRENGTH_JUVENIL+diffAdj))/120 + CHAMPION_LUCK_CHANCE,.15,.85);
    const br = simulateBracket(3, chance);
    cupResult = {label, champ:br.champ};
  } else {
    const tier = clamp(p.clubDivisionTier,0,cat.divisions-1);
    posFinal = simulateStandingsAdulta(tier, p.ovr);
    tierLabel = cat.divisions<=1 ? 'Categoría única' : ('Divisional '+DIV_LETTERS[tier]);
    tierUpdate = updateTierAdulta(cat, tier, posFinal);
    if(posFinal<=4){ honorResult = simulateHonor(p.ovr, baseStrengthAdult(tier)); }
  }

  // En las Divisionales de 16 equipos se juegan 22 fechas por temporada; en las Series juveniles,
  // todos contra todos entre los equipos de la serie.
  const pj = cat.type==='adulta' ? randi(20,22) : Math.max(6, Math.round((serieTeamsFor(cat.id)-1)*rand(.8,1)));
  const gf = GOAL_FACTOR[p.posicion]||.1, af = AST_FACTOR[p.posicion]||.1;
  const gls = Math.max(0, Math.round(pj*gf*(p.ovr/70)*rand(.6,1.3)));
  const ast = Math.max(0, Math.round(pj*af*(p.ovr/70)*rand(.6,1.3)));
  const amarillas = randi(0, Math.round(pj*0.28));
  const rojas = Math.random()<0.12 ? 1 : 0;
  const mvp = posFinal<=2 && p.ovr > (cat.type==='juvenil'?BASE_STRENGTH_JUVENIL:baseStrengthAdult(p.clubDivisionTier))+10 && Math.random()<0.3;
  // Balón de goleador: se lo lleva quien tuvo una temporada goleadora de verdad (0.5+ goles por
  // partido), pero no es automático — siempre hay otros candidatos peleándolo en la categoría.
  const golRate = pj>0 ? gls/pj : 0;
  const isTopScorer = golRate >= 0.5 && Math.random() < 0.25;

  const trophies=[]; const achievements=[];
  if(posFinal===1){ trophies.push('Campeón de Liga — '+cat.label+' ('+p.edad+' años)'); p.career.ligaTitles++; }
  if(posFinal===2){ achievements.push('Subcampeón — '+cat.label+' ('+p.edad+' años)'); p.career.subcampeonatos++; }
  if(cupResult && cupResult.champ){
    trophies.push('Campeón '+cupResult.label+' — '+cat.label+' ('+p.edad+' años)');
    if(cupResult.label==='Copa de Oro') p.career.copaOro++;
    else if(cupResult.label==='Copa de Plata') p.career.copaPlata++;
    else if(cupResult.label==='Copa de Bronce') p.career.copaBronce++;
    else p.career.copaConfraternidad++;
  }
  if(honorResult && honorResult.champ){ trophies.push('Campeón de Honor — '+cat.label+' ('+p.edad+' años)'); p.career.honorTitles++; }
  if(tierUpdate.dir==='up') p.career.ascensos++;
  if(tierUpdate.dir==='down') p.career.descensos++;
  if(mvp){ achievements.push('MVP — '+cat.label+' ('+p.edad+' años)'); p.career.mvps++; }
  if(isTopScorer){ trophies.push('Balón de Goleador — '+cat.label+' ('+p.edad+' años)'); p.career.goleadores++; }
  p.career.amarillas += amarillas; p.career.rojas += rojas;

  const histRow = {
    edad:p.edad, categoria:cat.label, club:p.club, tierLabel, posFinal, pj, gls, ast,
    ovr:Math.round(p.ovr), cupLabel: cupResult?cupResult.label:null, cupChamp: cupResult?cupResult.champ:false,
    honorQualified: !!honorResult, honorChamp: honorResult?honorResult.champ:false,
    tierNote: tierUpdate.note, tierDir: tierUpdate.dir, mvp, topScorer: isTopScorer
  };
  p.pj+=pj; p.gls+=gls; p.ast+=ast;
  p.history.push(histRow);
  trophies.forEach(t=>p.trophies.push(t));
  achievements.forEach(a=>p.achievements.push(a));
  if(cat.type==='adulta') p.clubDivisionTier = tierUpdate.newTier;

  state.lastResult = histRow;
  state.screen='result';
  render();
}

function advanceAfterResult(){
  if(Math.random()<0.4){
    const pool = getEventPool(state.player);
    state.pendingEvent = pool[Math.floor(Math.random()*pool.length)];
    state.screen='event'; render();
  } else finishAdvance();
}
function resolveEvent(option){
  const p = state.player;
  p._attrDelta = {};
  p._eventNote = '';
  option.apply(p);
  state.lastEventNote = p._eventNote;
  finishAdvance(p._attrDelta);
}
function finishAdvance(extraAttrDelta){
  const p = state.player;
  growAttributes(p, extraAttrDelta||{});
  p.edad += 1;
  const nextCat = categoryForAge(p.edad);
  if(!nextCat){ state.screen='retired'; render(); return; }
  // Todos los saltos de categoría se dan por defecto según la edad (Sub14→Sub16→Sub18→Sub20→Reserva).
  // La única excepción es el pase de Reserva a Mayores: ese salto no es automático "de nombre" nomás,
  // se narra como el llamado del DT de Primera para que el jugador lo sienta como un logro.
  const isCallUpToMayores = nextCat.id==='mayores' && p.lastCategoryId==='reserva';
  if(nextCat.id !== p.lastCategoryId){
    if(nextCat.type==='juvenil'){ p.serieLetter = realSerieLetter(nextCat.id, p.club) || DIV_LETTERS[randi(0,3)]; }
    else {
      // Al entrar a una nueva categoría adulta (Sub20, Reserva, Mayores, Pre Senior, Más 40)
      // la divisional de arranque siempre se recalcula desde la fuerza histórica del club, nunca se
      // arrastra el índice tal cual — así un club chico no "hereda" la A solo por haber llegado
      // arriba en una categoría con menos divisionales.
      p.clubDivisionTier = assignInitialAdultTier(nextCat, p.ovr, p.club);
    }
    p.lastCategoryId = nextCat.id;
  }
  state.showDetails=false;
  state.screen = isCallUpToMayores ? 'callup' : 'season';
  render();
}
function continueFromCallup(){ state.screen='season'; render(); }
function retireNow(){ state.screen='retired'; render(); }
function toggleDetails(){ state.showDetails = !state.showDetails; render(); }

// Mercado de pases realista:
// - Casi siempre ofertas de clubes de nivel similar o vecino (nunca saltos de más de 2-3 escalones).
// - Si jugás en la G, primero llegan ofertas de F/E/D; a C/B/A solo con muy buen rendimiento.
// - Si ya jugás en la A, no vas a recibir solo ofertas de categorías muy inferiores.
// - (Ya no hay clubes filiales con variantes de color en la nómina; esta rama queda inactiva.)
function weightedDelta(currentTier, maxTier, ovr, ref){
  const opts = [{d:0, w:3}];
  if(currentTier>0) opts.push({d:-1, w:4});
  if(currentTier<maxTier) opts.push({d:1, w:3});
  if(currentTier>=2 && ovr>=ref+16) opts.push({d:-2, w:1.2});
  if(currentTier>=3 && ovr>=ref+20) opts.push({d:-3, w:0.6});
  const total = opts.reduce((s,o)=>s+o.w,0);
  let r = Math.random()*total;
  for(const o of opts){ if(r<o.w) return o.d; r-=o.w; }
  return 0;
}
function findClubForTier(targetTier, cat, excludeNames){
  for(let radius=0; radius<=cat.divisions; radius++){
    const candidates = CLUB_POOL.filter(c=>{
      const t = tierInCategory(c.tier, cat.divisions);
      return Math.abs(t-targetTier)===radius && !excludeNames.includes(c.name);
    });
    if(candidates.length) return shuffle(candidates)[0];
  }
  return null;
}
function openTransferMarket(){
  const p = state.player;
  const cat = currentCategory();
  const used = [p.club];
  const offers = [];
  const myClub = clubOf(p.club);

  // Llamado del club principal si jugás en una filial.
  if(!myClub.isParent && Math.random()<0.55){
    const parent = familyParentOf(p.club);
    if(parent.name!==p.club){
      const parentTier = cat.type==='adulta' ? tierInCategory(parent.tier, cat.divisions) : null;
      offers.push({name:parent.name, tier:parentTier, familyCall:true});
      used.push(parent.name);
    }
  }

  if(cat.type==='adulta'){
    const maxTier = cat.divisions-1;
    const ref = baseStrengthAdult(p.clubDivisionTier);
    let guard = 0;
    while(offers.length<2 && guard<20){
      guard++;
      const delta = weightedDelta(p.clubDivisionTier, maxTier, p.ovr, ref);
      const targetTier = clamp(p.clubDivisionTier+delta, 0, maxTier);
      const club = findClubForTier(targetTier, cat, used);
      if(!club) break;
      offers.push({name:club.name, tier:targetTier, familyCall:false});
      used.push(club.name);
    }
  } else {
    const rest = shuffle(CLUB_POOL.filter(c=>!used.includes(c.name)));
    while(offers.length<2 && rest.length){ offers.push({name:rest.pop().name, tier:null, familyCall:false}); }
  }

  state.transferOffers = offers;
  state.screen='transfer'; render();
}
function pickTransfer(offer){
  const p = state.player;
  p.club = offer.name;
  if(!p.clubsPlayed.includes(offer.name)) p.clubsPlayed.push(offer.name);
  if(offer.tier!==null && offer.tier!==undefined) p.clubDivisionTier = offer.tier;
  state.screen='season'; render();
}
function cancelTransfer(){ state.screen='season'; render(); }
function restart(){ state=newState(); render(); }

function renderCategoryDetails(cat){
  if(cat.type==='juvenil'){
    return `<div class="details-box">
      <div class="details-row">Formato: Series, todos contra todos, sin ascenso ni descenso.</div>
      <div class="details-row">Equipos por serie: ${serieTeamsFor(cat.id)}</div>
      <div class="details-row">Copas: 🥇 Copa de Oro · 🥈 Copa de Plata · 🥉 Copa de Bronce · 🤝 Copa de Confraternidad, según tu posición final en la serie.</div>
      <div class="details-row">Esta categoría no tiene Campeonato de Honor: esa instancia recién arranca en Sub 20.</div>
    </div>`;
  } else if(cat.divisions<=1){
    return `<div class="details-box">
      <div class="details-row">Formato: una sola categoría de ${cat.teams} equipos, sin ascenso ni descenso.</div>
      <div class="details-row">Hay Campeón y Subcampeón.</div>
      <div class="details-row">Campeonato de Honor: clasifican los 4 primeros. Un solo campeón.</div>
    </div>`;
  } else {
    const letters = DIV_LETTERS.slice(0,cat.divisions).join(' · ');
    return `<div class="details-box">
      <div class="details-row">Divisionales existentes: ${letters} (${cat.divisions} en total, ${cat.teams} equipos cada una)</div>
      <div class="details-row">Suben los 4 primeros de cada Divisional (menos en la A). Bajan los 4 últimos (menos en la última). Siempre un escalón por temporada.</div>
      <div class="details-row">Hay Campeón y Subcampeón en cada Divisional.</div>
      <div class="details-row">Campeonato de Honor: clasifican los 4 primeros de cada Divisional. Un solo campeón para toda la categoría.</div>
    </div>`;
  }
}

function renderHistoryTable(p){
  if(p.history.length===0) return `<p class="muted" style="font-size:13px;">Todavía no jugaste ninguna temporada.</p>`;
  const rows = p.history.slice().reverse().map(h=>`
    <tr>
      <td>${h.edad}</td>
      <td>${h.club}<br><span class="muted" style="font-size:11px;">${h.categoria} · ${h.tierLabel}</span></td>
      <td>${h.ovr}</td>
      <td>${h.posFinal}º</td>
      <td>${h.gls}</td>
      <td>${h.ast}</td>
      <td>
        ${h.tierDir ? `<span class="tag ${h.tierDir==='up'?'up':'down'}">${h.tierDir==='up'?'Ascenso':'Descenso'}</span>` : ''}
        ${h.posFinal===1 ? `<span class="tag oro">Liga</span>` : ''}
        ${h.cupChamp ? `<span class="tag ${h.cupLabel==='Copa de Oro'?'oro':h.cupLabel==='Copa de Plata'?'plata':h.cupLabel==='Copa de Bronce'?'bronce':'confrat'}">${h.cupLabel}</span>` : ''}
        ${h.honorChamp ? `<span class="tag honor">Honor</span>` : ''}
        ${h.mvp ? `<span class="tag oro">MVP</span>` : ''}
        ${h.topScorer ? `<span class="tag oro">⚽ Goleador</span>` : ''}
      </td>
    </tr>
  `).join('');
  return `<table><thead><tr><th>Edad</th><th>Club</th><th>OVR</th><th>Pos</th><th>Gls</th><th>Ast</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function renderTrophies(p){
  if(p.trophies.length===0) return `<p class="muted" style="font-size:13px;">Vitrina vacía... por ahora.</p>`;
  return `<div class="trophy-list">${p.trophies.slice().reverse().map(t=>`<div class="trophy-item">🏆 <span style="font-size:13px;">${t}</span></div>`).join('')}</div>`;
}

function renderResult(){
  const p = state.player;
  const h = state.lastResult;
  let trophyBlocks = '';
  if(h.posFinal===1){
    trophyBlocks += `<div class="trophy-anim"><div class="icon">${trophySVG('liga')}</div><div class="label">Campeón de Liga</div></div>`;
  }
  if(h.cupChamp){
    const kind = h.cupLabel==='Copa de Oro'?'oro':h.cupLabel==='Copa de Plata'?'plata':h.cupLabel==='Copa de Bronce'?'bronce':'confrat';
    trophyBlocks += `<div class="trophy-anim small"><div class="icon">${trophySVG(kind)}</div><div class="label">${h.cupLabel}</div></div>`;
  }
  if(h.honorChamp){
    trophyBlocks += `<div class="trophy-anim honor"><div class="icon">${trophySVG('honor')}</div><div class="label">Campeón de Honor</div></div>`;
  }
  if(h.topScorer){
    trophyBlocks += `<div class="trophy-anim small"><div class="icon">${soccerBallSVG()}</div><div class="label">Balón de Goleador</div></div>`;
  }
  let msgs = [];
  if(h.cupLabel && !h.cupChamp) msgs.push(`Jugaste la ${h.cupLabel}, pero quedaste en el camino.`);
  if(h.honorQualified && !h.honorChamp) msgs.push('Clasificaste al Campeonato de Honor, pero no lograste el título.');
  if(h.mvp) msgs.push('Además, fuiste elegido MVP de la temporada.');
  return `
  <div class="eyebrow">${h.categoria} · ${h.edad} años</div>
  <h2>Temporada cerrada</h2>
  <div class="card">
    ${trophyBlocks}
    <p>Terminaste <strong>${h.posFinal}º</strong> en ${h.tierLabel} con <strong>${p.club}</strong>.</p>
    <div class="stat-grid">
      <div class="stat-box"><div class="v">${h.pj}</div><div class="l">PJ</div></div>
      <div class="stat-box"><div class="v">${h.gls}</div><div class="l">Goles</div></div>
      <div class="stat-box"><div class="v">${h.ast}</div><div class="l">Asist.</div></div>
      <div class="stat-box"><div class="v">${h.ovr}</div><div class="l">OVR</div></div>
    </div>
    ${h.tierNote ? `<p><span class="tag ${h.tierDir==='up'?'up':'down'}">${h.tierNote}</span></p>` : ''}
    ${msgs.length? `<p class="muted">${msgs.join(' ')}</p>` : ''}
  </div>
  <button class="btn gold" data-action="advance">Continuar</button>
  `;
}

/* ================= BIND ================= */
function bindEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const action = el.getAttribute('data-action');
      if(action==='start') startCreate();
      else if(action==='pos'){ state.player.posicion = el.getAttribute('data-val'); render(); }
      else if(action==='pierna'){ state.player.pierna = el.getAttribute('data-val'); render(); }
      else if(action==='toOffers'){
        state.player.apellido = document.getElementById('apellido').value.toUpperCase();
        state.player.numero = parseInt(document.getElementById('numero').value)||10;
        state.player.pais = document.getElementById('pais').value;
        goToOffers();
      }
      else if(action==='pickClub'){ pickClub(el.getAttribute('data-name')); }
      else if(action==='playSeason') playSeason();
      else if(action==='transferMarket') openTransferMarket();
      else if(action==='pickTransfer'){ pickTransfer(state.transferOffers[parseInt(el.getAttribute('data-idx'))]); }
      else if(action==='cancelTransfer') cancelTransfer();
      else if(action==='retire') retireNow();
      else if(action==='advance') advanceAfterResult();
      else if(action==='event'){ resolveEvent(state.pendingEvent.options[parseInt(el.getAttribute('data-idx'))]); }
      else if(action==='restart') restart();
      else if(action==='toggleDetails') toggleDetails();
      else if(action==='continueCallup') continueFromCallup();
    });
  });
}

/* ================= CONTADORES GLOBALES (públicos, sin configurar nada) =================
   Dos contadores reales, compartidos entre TODOS los que jueguen desde cualquier navegador:
   uno de carreras iniciadas y otro de partidas (temporadas) jugadas. Usan un servicio de
   contadores públicos y gratuitos (countapi.mileshilliard.com, el reemplazo activo del viejo
   countapi.xyz que dejó de funcionar) — no hace falta crear ninguna cuenta ni configurar nada,
   funcionan apenas subís el archivo. Como esa API no usa "namespaces" (todas las claves son
   globales), las claves de acá abajo ya son bien únicas para no chocar con el contador de nadie
   más. Si por algún motivo el servicio no responde, cada contador cae de forma automática a un
   conteo local en el propio navegador (se avisa con "(en este navegador)") para que el número
   nunca quede roto en pantalla.
*/
const COUNTER_API_BASE = 'https://countapi.mileshilliard.com/api/v1';
const CAREERS_KEY = 'liguero_lud_santiago_geisinger_carreras_iniciadas';
const SEASONS_KEY = 'liguero_lud_santiago_geisinger_partidas_jugadas';

function parseCounterValue(data){
  if(!data) return null;
  const n = typeof data.value === 'number' ? data.value : parseInt(data.value, 10);
  return Number.isFinite(n) ? n : null;
}
async function fetchGlobalCount(key){
  try{
    const res = await fetch(`${COUNTER_API_BASE}/get/${key}`);
    if(res.status === 404) return 0; // todavía nadie hizo el primer hit de esta clave
    const data = await res.json();
    return parseCounterValue(data);
  }catch(e){ return null; }
}
async function hitGlobalCount(key){
  try{
    const res = await fetch(`${COUNTER_API_BASE}/hit/${key}`);
    const data = await res.json();
    return parseCounterValue(data);
  }catch(e){ return null; }
}

// Lee los dos contadores globales al cargar la página (nunca los incrementa, solo los muestra).
async function loadCareerCount(){
  const el = document.getElementById('careerCount');
  const elSeasons = document.getElementById('seasonsCount');
  const [careers, seasons] = await Promise.all([fetchGlobalCount(CAREERS_KEY), fetchGlobalCount(SEASONS_KEY)]);
  if(el) el.textContent = careers!==null ? careers : (parseInt(localStorage.getItem('lud_local_careers')||'0',10)+' (en este navegador)');
  if(elSeasons) elSeasons.textContent = seasons!==null ? seasons : (parseInt(localStorage.getItem('lud_local_seasons')||'0',10)+' (en este navegador)');
}

// Suma 1 al contador global de carreras. Se llama SOLO desde startCreate() (click en
// "Comenzar carrera"), nunca al recargar la página ni al elegir posición/club.
async function incrementCareerCounter(){
  const el = document.getElementById('careerCount');
  const n = await hitGlobalCount(CAREERS_KEY);
  if(n!==null){ if(el) el.textContent = n; return; }
  let local = parseInt(localStorage.getItem('lud_local_careers')||'0',10)+1;
  try{ localStorage.setItem('lud_local_careers', String(local)); }catch(_){}
  if(el) el.textContent = local+' (en este navegador)';
}

// Suma 1 al contador global de partidas (temporadas jugadas). Se llama SOLO desde playSeason()
// (click en "Jugar temporada"), así el número refleja partidas reales de todo el mundo.
async function incrementSeasonsCounter(){
  const el = document.getElementById('seasonsCount');
  const n = await hitGlobalCount(SEASONS_KEY);
  if(n!==null){ if(el) el.textContent = n; return; }
  let local = parseInt(localStorage.getItem('lud_local_seasons')||'0',10)+1;
  try{ localStorage.setItem('lud_local_seasons', String(local)); }catch(_){}
  if(el) el.textContent = local+' (en este navegador)';
}

let feedbackRating = null;
function setupFeedbackUI(){
  const btn=document.getElementById('feedbackBtn');
  const modal=document.getElementById('feedbackModal');
  const rateUp=document.getElementById('rateUp');
  const rateDown=document.getElementById('rateDown');
  const send=document.getElementById('sendFeedback');
  const close1=document.getElementById('closeFeedback');
  const close2=document.getElementById('closeFeedback2');
  function openModal(){ modal.style.display='flex'; document.getElementById('feedbackForm').style.display='block'; document.getElementById('feedbackThanks').style.display='none'; }
  function closeModal(){ modal.style.display='none'; }
  // El botón de feedback es flotante y discreto: solo aparece si se lo toca, nunca interrumpe la partida.
  btn.addEventListener('click', openModal);
  close1.addEventListener('click', closeModal);
  close2.addEventListener('click', closeModal);
  modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });
  rateUp.addEventListener('click', ()=>{ feedbackRating='up'; rateUp.classList.add('active'); rateDown.classList.remove('active'); });
  rateDown.addEventListener('click', ()=>{ feedbackRating='down'; rateDown.classList.add('active'); rateUp.classList.remove('active'); });
  send.addEventListener('click', async ()=>{
    const comment = document.getElementById('feedbackComment').value.trim();
    const payload = {rating:feedbackRating, comment, ts:Date.now()};
    let saved=false;
    if(window.storage){
      try{
        const key = 'feedback:'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        await window.storage.set(key, JSON.stringify(payload), true);
        saved=true;
      }catch(e){ saved=false; }
    }
    if(!saved){
      // Publicado como página web sin backend propio: se guarda localmente en el navegador.
      // Para recibir estos comentarios de verdad, conviene reemplazar este bloque por un
      // endpoint gratuito tipo Formspree o un Google Form, o simplemente leer el localStorage
      // "lud_feedback_*" desde la consola del navegador de quien lo publique.
      try{ localStorage.setItem('lud_feedback_'+Date.now(), JSON.stringify(payload)); }catch(e){}
      saved = true;
    }
    document.getElementById('feedbackForm').style.display='none';
    document.getElementById('feedbackThanks').style.display='block';
  });
}

/* ================= INIT ================= */
state = newState();
render();
setupFeedbackUI();
loadCareerCount();
</script>
